name: Tests

# Runs the deterministic pytest suite on every push/PR -- pure Python,
# zero API calls, zero cost (100 tests, a few seconds locally). Deliberately
# does NOT run `adk eval`: the live eval harness (eval/argus_evalset.json)
# invokes the real agent against the real Gemini API, which would need a
# GOOGLE_API_KEY as a repo secret and would burn free-tier quota (a
# 15-requests/minute ceiling this project has run into repeatedly) on
# every single push. Run it on demand locally instead -- see "Evaluation
# and the ablation experiment" in README.md, and "Reproducing the results"
# in DEVLOG.md for the exact commands.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v
